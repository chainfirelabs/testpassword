# All-in-one against an S3 bucket you provide (AWS or any compatible store).
# Nothing here runs storage: creating and keeping the bucket is up to you.
#
#   cp .env.example .env              # set the bucket, endpoint and keys
#   docker compose up -d
#   docker compose run -d ingest      # download both formats, then publish both
name: testpassword-external-s3

x-s3: &s3
  PWNED_SOURCE: s3
  PWNED_S3_ENDPOINT: ${PWNED_S3_ENDPOINT:-}
  PWNED_S3_BUCKET: ${PWNED_S3_BUCKET:?Set PWNED_S3_BUCKET}
  PWNED_S3_ACCESS_KEY: ${PWNED_S3_ACCESS_KEY:-}
  PWNED_S3_SECRET_KEY: ${PWNED_S3_SECRET_KEY:-}
  PWNED_S3_REGION: ${PWNED_S3_REGION:-us-east-1}

services:
  download-sha1: &download
    profiles: [download]
    image: ${PWNED_REGISTRY:-ghcr.io}/${PWNED_IMAGE_NAMESPACE:-chainfirelabs/testpassword}/pwned-downloader:${PWNED_IMAGE_TAG:-latest}
    command: [sha1]
    user: "${PWNED_UID:-1000}:${PWNED_GID:-1000}"
    volumes:
      - ./data:/data
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  download-ntlm:
    <<: *download
    command: [ntlm]

  upload-sha1: &upload
    profiles: [upload]
    image: ${PWNED_REGISTRY:-ghcr.io}/${PWNED_IMAGE_NAMESPACE:-chainfirelabs/testpassword}/pwned-api-s3:${PWNED_IMAGE_TAG:-latest}
    command: [/app/common/manage.py, upload, sha1]
    environment: *s3
    user: "${PWNED_UID:-1000}:${PWNED_GID:-1000}"
    volumes:
      - ./data:/data:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  upload-ntlm:
    <<: *upload
    command: [/app/common/manage.py, upload, ntlm]

  ingest:
    profiles: [ingest]
    image: ${PWNED_REGISTRY:-ghcr.io}/${PWNED_IMAGE_NAMESPACE:-chainfirelabs/testpassword}/pwned-downloader:${PWNED_IMAGE_TAG:-latest}
    entrypoint: [/usr/bin/python3, /app/common/manage.py, ingest]
    environment: *s3
    user: "${PWNED_UID:-1000}:${PWNED_GID:-1000}"
    volumes:
      - ./data:/data
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  api:
    image: ${PWNED_REGISTRY:-ghcr.io}/${PWNED_IMAGE_NAMESPACE:-chainfirelabs/testpassword}/pwned-api-s3:${PWNED_IMAGE_TAG:-latest}
    environment:
      <<: *s3
      PWNED_API_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: [CMD, /usr/bin/python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3

  traefik:
    image: traefik:v3.7@sha256:5203c3f39ca70de6790d964624e042463ffbd57715bc82be155cf224c0dd5144
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --entrypoints.web.address=:8080
      - --entrypoints.websecure.address=:8443
      - --entrypoints.web.http.redirections.entrypoint.to=:443
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.http.tls=true
    ports:
      - "${PWNED_WEB_BIND:-127.0.0.1}:80:8080"
      - "${PWNED_WEB_BIND:-127.0.0.1}:443:8443"
    volumes:
      - ./proxy/dynamic:/etc/traefik/dynamic:ro
      - ./proxy/certs:/certs:ro
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
